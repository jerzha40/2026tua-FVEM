<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" width="340" height="200">

    <!-- Triangle -->
    <path d="M61 166 L281 166 L173 23 Z" fill="#1685c1" fill-opacity="0.09" stroke="#1685c1" stroke-width="2" />

    <!-- Vertices -->
    <g fill="#1685c1">
        <circle cx="61" cy="166" r="4" />
        <circle cx="281" cy="166" r="4" />
        <circle cx="173" cy="23" r="4" />
    </g>

    <!-- Labels with native SVG subscripts -->
    <g font-family="Arial, sans-serif" font-size="13" fill="#1685c1">

        <text x="42" y="183">A<tspan font-size="9" dy="3">1</tspan></text>

        <text x="281" y="183">A<tspan font-size="9" dy="3">2</tspan></text>

        <text x="173" y="14" text-anchor="middle">
            A<tspan font-size="9" dy="3">3</tspan>
        </text>
    </g>

    <!-- Barycenter -->
    <circle cx="172" cy="115" r="4" fill="#e89432" />

    <!-- Barycentric coordinates -->
    <text x="172" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c77a22">λ<tspan
            font-size="9" dy="3">1</tspan>
        <tspan font-size="12" dy="-3">=λ</tspan>
        <tspan font-size="9" dy="3">2</tspan>
        <tspan font-size="12" dy="-3">=λ</tspan>
        <tspan font-size="9" dy="3">3</tspan>
        <tspan font-size="12" dy="-3">=1/3</tspan>
    </text>
</svg>